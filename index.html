<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dashboard avec Portes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Dashboard IA Futuriste</h1>

  <!-- Portes principales -->
  <div class="portes">
    <div class="porte" onclick="ouvrirChambre('scanner')">🚪 Scanner</div>
    <div class="porte" onclick="ouvrirChambre('boussole')">🚪 Boussole</div>
    <div class="porte" onclick="ouvrirChambre('bibliotheque')">🚪 Bibliothèque</div>
    <div class="porte" onclick="ouvrirChambre('generateur')">🚪 Générateur</div>
    <div class="porte" onclick="ouvrirChambre('laboratoire')">🚪 Laboratoire</div>
    <div class="porte" onclick="ouvrirChambre('galerie')">🚪 Galerie</div>
    <div class="porte" onclick="ouvrirChambre('climat')">🚪 Climat</div>
    <div class="porte" onclick="ouvrirChambre('oracle')">🚪 Oracle</div>
  </div>

  <!-- Chambres (modules) -->
  <div id="scanner" class="chambre">📡 Chambre Scanner</div>
  <div id="boussole" class="chambre">🧭 Chambre Boussole</div>
  <div id="bibliotheque" class="chambre">📚 Chambre Bibliothèque</div>
  <div id="generateur" class="chambre">⚡ Chambre Générateur</div>
  <div id="laboratoire" class="chambre">🔬 Chambre Laboratoire</div>
  <div id="galerie" class="chambre">🎶 Chambre Galerie</div>
  <div id="climat" class="chambre">🌦️ Chambre Climat</div>
  <div id="oracle" class="chambre">🔮 Chambre Oracle</div>

  <script>
    function ouvrirChambre(nom) {
      // Fermer toutes les chambres
      document.querySelectorAll('.chambre').forEach(c => c.style.display = 'none');
      // Ouvrir la chambre choisie
      document.getElementById(nom).style.display = 'block';
      alert("La porte " + nom + " est ouverte !");
    }
  </script>
</body>
</html>
