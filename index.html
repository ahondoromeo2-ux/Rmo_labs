<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Futuriste</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Barre de navigation avec avatars -->
  <nav>
    <div class="avatars">
      <div class="avatar" id="copilot">🤖</div>
      <div class="avatar" id="gemini">✨</div>
    </div>
    <ul>
      <li>Accueil</li>
      <li>Rapports</li>
      <li>Statistiques</li>
      <li>Paramètres</li>
      <li>Notifications</li>
    </ul>
  </nav>

  <!-- En-tête -->
  <header>
    <h1>Bomtar Rtírck</h1>
    <p>Assistant IA connecté à tes modules</p>
  </header>

  <!-- Exemple de cartes -->
  <div class="dashboard">
    <div class="card">
      <h2>Progression</h2>
      <canvas id="chart1"></canvas>
      <p>35%</p>
    </div>
    <div class="card">
      <h2>Statistiques Mensuelles</h2>
      <canvas id="chart2"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Graphique circulaire
    new Chart(document.getElementById("chart1"), {
      type: "doughnut",
      data: {
        labels: ["Progression", "Reste"],
        datasets: [{
          data: [35, 65],
          backgroundColor: ["#0ff", "#222"]
        }]
      }
    });

    // Graphique en ligne
    new Chart(document.getElementById("chart2"), {
      type: "line",
      data: {
        labels: ["Janvier", "Février", "Mars", "Avril"],
        datasets: [{
          label: "Croissance",
          data: [16, 20, 30, 25],
          borderColor: "#0ff",
          fill: false
        }]
      }
    });
  </script>
</body>
</html>
