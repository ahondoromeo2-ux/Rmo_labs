<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Futuriste</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- Barre de navigation avec avatars -->
  <nav>
    <div class="avatars">
      <img src="copilot.png" alt="Copilot" class="avatar">
      <img src="gemini.png" alt="Gemini" class="avatar">
    </div>
    <ul>
      <li>Accueil</li>
      <li>Rapports</li>
      <li>Statistiques</li>
      <li>Paramètres</li>
      <li>Notifications</li>
    </ul>
  </nav>

  <!-- En-tête -->
  <header>
    <h1>Bomtar Rtírck</h1>
    <p>Assistant IA connecté à tes modules</p>
  </header>

  <!-- Cartes principales -->
  <div class="dashboard">
    <div class="card">
      <h2>Progression</h2>
      <canvas id="chart1"></canvas>
      <p>35%</p>
    </div>

    <div class="card">
      <h2>Statistiques Mensuelles</h2>
      <canvas id="chart2"></canvas>
    </div>

    <div class="card">
      <h2>Performance</h2>
      <p>Latences service : 84%</p>
      <p>Loisir actives : 0%</p>
      <p>Temps de réponse : 13.22 ms</p>
    </div>
  </div>

  <!-- Tes fonctionnalités (modules) -->
  <div class="fonctions">
    <button class="cyan">Scanner</button>
    <button class="bleu">Boussole</button>
    <button class="vert">Bibliothèque</button>
    <button class="orange">Générateur</button>
    <button class="rouge">Laboratoire</button>
    <button class="violet">Galerie</button>
    <button class="cyan">Climat</button>
    <button class="bleu">Oracle</button>
  </div>

  <!-- Statistiques Planétaires -->
  <div class="card large">
    <h2>Statistiques Planétaires</h2>
    <canvas id="chart3"></canvas>
  </div>

  <script>
    // Graphique circulaire
    new Chart(document.getElementById("chart1"), {
      type: "doughnut",
      data: {
        labels: ["Progression", "Reste"],
        datasets: [{
          data: [35, 65],
          backgroundColor: ["#0ff", "#222"]
        }]
      }
    });

    // Graphique en ligne
    new Chart(document.getElementById("chart2"), {
      type: "line",
      data: {
        labels: ["Janvier", "Février", "Mars", "Avril"],
        datasets: [{
          label: "Croissance",
          data: [16, 20, 30, 25],
          borderColor: "#0ff",
          fill: false
        }]
      }
    });

    // Graphique en barres (planétaire)
    new Chart(document.getElementById("chart3"), {
      type: "bar",
      data: {
        labels: ["Amérique", "Europe", "Asie", "Afrique", "Océanie"],
        datasets: [{
          label: "Population (milliers)",
          data: [100, 80, 120, 60, 40],
          backgroundColor: ["#0ff","#00f","#f80","#f00","#800"]
        }]
      }
    });
  </script>
</body>
</html>
